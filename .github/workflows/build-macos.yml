name: Build verified macOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag
        required: true
        default: v0.9.2
      source_sha256:
        description: SHA-256 of the complete source ZIP on the draft
        required: true
      release_id:
        description: Numeric ID of the draft release
        required: true

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_ID: ${{ inputs.release_id }}
      SOURCE_SHA256: ${{ inputs.source_sha256 }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.9'
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
      - name: Download the same verified source as Windows
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,os,re,subprocess,zipfile
          tag=os.environ['RELEASE_TAG'];rid=os.environ['RELEASE_ID'];repo=os.environ['GH_REPO']
          assert re.fullmatch(r'v\d+\.\d+\.\d+',tag) and rid.isdigit()
          release=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/{rid}']))
          assert release['draft'] and release['tag_name']==tag
          name=f'MUTEX-Imatest-{tag[1:]}-source.zip'
          asset=next(a for a in release['assets'] if a['name']==name)
          archive=Path('source.zip')
          with archive.open('wb') as out:
              subprocess.run(['gh','api','-H','Accept: application/octet-stream',f"repos/{repo}/releases/assets/{asset['id']}"],stdout=out,check=True)
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==os.environ['SOURCE_SHA256']
          root=Path('source-tree').resolve()
          with zipfile.ZipFile(archive) as z:
              assert all((root/n).resolve().is_relative_to(root) for n in z.namelist())
              z.extractall(root)
          target=root/'private_assets/bundled_templates';target.parent.mkdir()
          (root/'template/bundled').rename(target)
      - name: Install the native LibRaw and locked runtime
        working-directory: source-tree
        run: |
          python -m venv .venv
          .venv/bin/python scripts/prepare_macos_runtime.py
      - name: Test the source on this architecture
        working-directory: source-tree
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/bin/python -c "import cv2,pytest;cv2.setNumThreads(1);raise SystemExit(pytest.main(['-q','--junitxml=validation/pytest.xml']))"
      - name: Build and package the app
        working-directory: source-tree
        run: |
          .venv/bin/python -m PyInstaller --noconfirm MUTEX-macos.spec
          .venv/bin/python scripts/package_macos.py
      - name: Verify the extracted archive with a native GUI and RAW files
        working-directory: source-tree
        run: .venv/bin/python scripts/verify_macos_release.py
      - name: Upload only verified macOS files to the same draft
        working-directory: source-tree
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,os,platform,subprocess,urllib.request,urllib.parse
          repo=os.environ['GH_REPO'];rid=os.environ['RELEASE_ID'];arch=platform.machine()
          release=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/{rid}']))
          assert release['draft'] and release['tag_name']==os.environ['RELEASE_TAG']
          audit=json.loads(Path(f'dist/macos-{arch}-checks.json').read_text())
          assert audit['passed'] and audit['architecture']==arch
          files=[Path('dist')/audit['archive']['file'],Path(f'dist/macos-{arch}-checks.json')]
          url=release['upload_url'].split('{')[0]
          assert urllib.parse.urlparse(url).netloc=='uploads.github.com'
          for p in files:
              old=next((a for a in release['assets'] if a['name']==p.name),None)
              if old:subprocess.run(['gh','api','--method','DELETE',f"repos/{repo}/releases/assets/{old['id']}"],check=True)
              req=urllib.request.Request(url+'?name='+urllib.parse.quote(p.name),data=p.read_bytes(),method='POST',headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/octet-stream'})
              with urllib.request.urlopen(req,timeout=900) as response:uploaded=json.load(response)
              assert uploaded['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
              print('Uploaded verified:',p.name,flush=True)
      - name: Retain diagnostics and synthetic UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-diagnostics
          path: |
            source-tree/validation/**/*.json
            source-tree/validation/**/*.log
            source-tree/validation/**/*.xml
            source-tree/validation/macos-final/selftest/*.png
            source-tree/build/MUTEX-macos/warn-*.txt
          retention-days: 7
